<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenDraw — Interactive Playground</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%232563eb%22><path d=%22M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z%22/></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --bg-bar: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-active: #eff6ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      background: var(--bg-canvas);
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .brand-pill {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      z-index: 50;
      user-select: none;
    }
    .logo {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      user-select: none;
    }
    #toolbar-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 10px;
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
      max-width: calc(100vw - 32px);
    }
    .tool-group {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .btn {
      height: 34px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      background: #e2e8f0;
    }
    .btn.active {
      background: var(--bg-bar);
      color: var(--accent);
      border-color: #cbd5e1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    .divider {
      width: 1px;
      height: 24px;
      background: var(--border-color);
      margin: 0 4px;
    }
    .colors {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .swatch:hover {
      transform: scale(1.18);
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      padding: 0 12px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .meta-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #bottom-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      padding: 4px 8px;
      gap: 4px;
      z-index: 50;
    }
    @media (max-width: 960px) {
      #bottom-bar {
        top: 16px;
        bottom: auto;
        right: 16px;
      }
    }
    #zoom-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 44px;
      text-align: center;
      user-select: none;
    }
    #shape-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 6px;
      padding-right: 8px;
      border-right: 1px solid var(--border-color);
      user-select: none;
    }
    .od-erase-target {
      opacity: 0.35 !important;
      outline: 2px dashed #ef4444;
    }
    .od-frame-target {
      outline: 2px dashed #3b82f6 !important;
    }
    .od-frame-target rect.od-frame-bg {
      stroke: #3b82f6 !important;
      stroke-dasharray: 4 2 !important;
      stroke-width: 2 !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Brand Pill at Top-Left -->
    <div class="brand-pill">
      <div class="logo">
        <span class="material-symbols-outlined" style="font-size: 22px; color: var(--accent);">draw</span>
        <span>OpenDraw</span>
      </div>
      <span class="badge">Playground</span>
    </div>

    <!-- Full-screen Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- Floating Bottom Dock Toolbar -->
    <nav id="toolbar-dock" aria-label="Canvas Toolbar">
      <!-- Main Tools with Material Symbols -->
      <div class="tool-group">
        <button class="btn btn-icon active" data-tool="select" title="Select & Transform (V)">
          <span class="material-symbols-outlined">near_me</span>
        </button>
        <button class="btn btn-icon" data-tool="rect" title="Rectangle Box (R)">
          <span class="material-symbols-outlined">crop_square</span>
        </button>
        <button class="btn btn-icon" data-tool="ellipse" title="Ellipse / Circle (O)">
          <span class="material-symbols-outlined">circle</span>
        </button>
        <button class="btn btn-icon" data-tool="text" title="Text Element (T)">
          <span class="material-symbols-outlined">title</span>
        </button>
        <button class="btn btn-icon" data-tool="frame" title="Artboard / Screen Frame (F)">
          <span class="material-symbols-outlined">crop_free</span>
        </button>
        <button class="btn btn-icon" data-tool="note" title="Sticky Note (N)">
          <span class="material-symbols-outlined">sticky_note_2</span>
        </button>
        <button class="btn btn-icon" data-tool="arrow" title="Connector Arrow (A)">
          <span class="material-symbols-outlined">arrow_right_alt</span>
        </button>
        <button class="btn btn-icon" data-tool="ink" title="Freehand Pen (P)">
          <span class="material-symbols-outlined">draw</span>
        </button>
        <button class="btn btn-icon" data-tool="eraser" title="Stroke Eraser (E)">
          <span class="material-symbols-outlined">ink_eraser</span>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Color Palette -->
      <div class="colors">
        <button class="swatch" style="background: #ffffff;" data-color="#ffffff" title="White Fill"></button>
        <button class="swatch" style="background: #f1f5f9;" data-color="#f1f5f9" title="Slate Gray Fill"></button>
        <button class="swatch" style="background: #3b82f6;" data-color="#3b82f6" title="Blue Fill"></button>
        <button class="swatch" style="background: #10b981;" data-color="#10b981" title="Emerald Fill"></button>
        <button class="swatch" style="background: #8b5cf6;" data-color="#8b5cf6" title="Violet Fill"></button>
        <button class="swatch" style="background: #f59e0b;" data-color="#f59e0b" title="Amber Fill"></button>
      </div>

      <div class="divider"></div>

      <!-- Actions with Material Symbols -->
      <div class="meta-actions">
        <button class="btn btn-icon" id="btn-undo" title="Undo (Ctrl+Z)">
          <span class="material-symbols-outlined">undo</span>
        </button>
        <button class="btn btn-icon" id="btn-redo" title="Redo (Ctrl+Y)">
          <span class="material-symbols-outlined">redo</span>
        </button>
        <button class="btn btn-icon" id="btn-delete" title="Delete Selected (Backspace / Delete)">
          <span class="material-symbols-outlined">delete</span>
        </button>
        <div class="divider"></div>
        <button class="btn btn-primary" id="btn-export-png" title="Download Wireframe as PNG">
          <span class="material-symbols-outlined" style="font-size: 18px;">image</span>
          <span>Export</span>
        </button>
        <button class="btn btn-icon" id="btn-export-json" title="Save .opendraw.json Snapshot">
          <span class="material-symbols-outlined">save</span>
        </button>
        <button class="btn btn-icon" id="btn-import-json" title="Open .opendraw.json Snapshot">
          <span class="material-symbols-outlined">folder_open</span>
        </button>
        <input type="file" id="file-import-json" accept=".json" style="display: none;">
        <button class="btn btn-icon" id="btn-clear" title="Clear Canvas">
          <span class="material-symbols-outlined">delete_sweep</span>
        </button>
      </div>
    </nav>

    <!-- Zoom & Stats Floating Panel -->
    <div id="bottom-bar">
      <span id="shape-count">0 shapes</span>
      <button class="btn btn-icon" id="btn-zoom-out" title="Zoom Out" style="width: 28px; height: 28px;">
        <span class="material-symbols-outlined" style="font-size: 18px;">remove</span>
      </button>
      <span id="zoom-label">100%</span>
      <button class="btn btn-icon" id="btn-zoom-in" title="Zoom In" style="width: 28px; height: 28px;">
        <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
      </button>
      <button class="btn btn-icon" id="btn-zoom-reset" title="Reset Zoom (100%)" style="width: 28px; height: 28px;">
        <span class="material-symbols-outlined" style="font-size: 18px;">restart_alt</span>
      </button>
    </div>
  </div>

  <script type="module" src="../src/playground.ts"></script>
</body>
</html>
