name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match 0.6.0 in packages/canvas/package.json)'
        required: true
        default: '0.6.0'

jobs:
  publish:
    name: Verify, Dry-run & Publish (@open-draw/schema then @open-draw/canvas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate version input matches package.json
        run: |
          CANVAS_VER=$(node -p "require('./packages/canvas/package.json').version")
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ] && [ "$INPUT_VER" != "$CANVAS_VER" ]; then
            echo "ERROR: Input version ($INPUT_VER) does not match packages/canvas/package.json ($CANVAS_VER)!"
            exit 1
          fi
          echo "Target publish version verified: $CANVAS_VER"

      - name: Verify All 9 CI Fences & Build
        run: npm run verify

      - name: Dry-run publish (@open-draw/schema)
        run: |
          SCHEMA_VER=$(node -p "require('./packages/schema/package.json').version")
          if npm view "@open-draw/schema@${SCHEMA_VER}" version >/dev/null 2>&1; then
            echo "@open-draw/schema@${SCHEMA_VER} already published on npm; skipping dry-run."
          else
            npm publish --dry-run --workspace @open-draw/schema
          fi

      - name: Dry-run publish (@open-draw/canvas)
        run: |
          CANVAS_VER=$(node -p "require('./packages/canvas/package.json').version")
          if npm view "@open-draw/canvas@${CANVAS_VER}" version >/dev/null 2>&1; then
            echo "@open-draw/canvas@${CANVAS_VER} already published on npm; skipping dry-run."
          else
            npm publish --dry-run --workspace @open-draw/canvas
          fi

      # Publish in strict topological order: schema first (if not already published), then canvas
      - name: Publish @open-draw/schema
        run: |
          SCHEMA_VER=$(node -p "require('./packages/schema/package.json').version")
          if npm view "@open-draw/schema@${SCHEMA_VER}" version >/dev/null 2>&1; then
            echo "@open-draw/schema@${SCHEMA_VER} already published on npm; skipping."
          else
            npm publish --workspace @open-draw/schema --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @open-draw/canvas
        run: |
          CANVAS_VER=$(node -p "require('./packages/canvas/package.json').version")
          if npm view "@open-draw/canvas@${CANVAS_VER}" version >/dev/null 2>&1; then
            echo "@open-draw/canvas@${CANVAS_VER} already published on npm; skipping."
          else
            npm publish --workspace @open-draw/canvas --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

