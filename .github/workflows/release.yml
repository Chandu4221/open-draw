name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  verify-main:
    name: "Tag must point at main (R-034)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse tags outside main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag points outside main. Releases come from main only (R-034)."
            exit 1
          }

  deploy:
    name: "Build tagged Studio → Cloudflare Pages (R-036)"
    needs: verify-main
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://open-draw.pages.dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio from the tag
        run: pnpm --filter studio exec vite build --base=/

      - name: Deploy to Cloudflare Pages (R-036)
        run: |
          npx -y --prefix /tmp wrangler pages project create open-draw --production-branch=main || true
          npx -y --prefix /tmp wrangler pages deploy apps/studio/dist --project-name=open-draw --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
