name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-main:
    name: "Tag must point at main (R-034)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse tags outside main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag points outside main. Releases come from main only (R-034)."
            exit 1
          }

  deploy:
    name: "Build tagged Studio + playground → GitHub Pages (R-036)"
    needs: verify-main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio from the tag
        run: pnpm --filter studio exec vite build --base=/open-draw/

      - name: Build Playground from the tag
        run: pnpm --filter playground exec vite build --base=/open-draw/playground/

      - name: Assemble Pages artifact
        run: |
          mkdir -p apps/studio/dist/playground
          cp -r apps/playground/dist/. apps/studio/dist/playground/
          touch apps/studio/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
