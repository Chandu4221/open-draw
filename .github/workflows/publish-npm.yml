name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack without publishing)"
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-main:
    name: "Publish must come from main (R-034)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse non-main commits
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Publishing is permitted from main branch only (R-034)."
            exit 1
          }

      - name: Verify package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/canvas/package.json').version")
          echo "Preparing release for @open-draw/canvas@$PKG_VERSION"

  publish:
    name: "Publish @open-draw/canvas"
    needs: verify-main
    runs-on: ubuntu-24.04
    environment: npm-release
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify
        run: |
          pnpm check
          pnpm --filter @open-draw/canvas build

      - name: Dry run pack
        if: ${{ inputs.dry_run }}
        run: pnpm --filter @open-draw/canvas pack --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @open-draw/canvas publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
